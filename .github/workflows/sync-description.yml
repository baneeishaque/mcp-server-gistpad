name: Sync Description

on:
  push:
    branches: [main, master]
    paths: ['README.md']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract description
        id: extract
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('README.md', 'utf8');
            const m = text.match(/<!-- START_DESCRIPTION -->([\s\S]*?)<!-- END_DESCRIPTION -->/);
            if (!m) throw new Error('START_DESCRIPTION/END_DESCRIPTION markers not found');
            return m[1].trim().replace(/\s+/g, ' ');
      - name: Update repo description
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh repo edit ${{ github.repository }} --description "${{ steps.extract.outputs.result }}"
