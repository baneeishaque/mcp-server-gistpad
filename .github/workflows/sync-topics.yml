name: Sync Topics

on:
  push:
    branches: [main, master]
    paths: ['README.md']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      repository-projects: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract topics
        id: extract
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('README.md', 'utf8');
            const table = text.match(/## Topics.*?\n(\|.*\|\n)+/s);
            if (!table) return '';
            const topics = [...table[0].matchAll(/`([a-z0-9-]+)`/g)].map((m) => m[1]);
            return topics.join(',');
      - name: Update repo topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOPICS="${{ steps.extract.outputs.result }}"
          [ -n "$TOPICS" ] || exit 0
          IFS=',' read -ra TAGS <<< "$TOPICS"
          for tag in "${TAGS[@]}"; do
            gh repo edit ${{ github.repository }} --add-topic "$tag"
          done
